
services:
  mediquery:
    build:
      context: .
      dockerfile: Dockerfile
    image: mediquery-rag-assistant:latest
    container_name: mediquery
    ports:
      - "8501:8501"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5-20251001}
      CLAUDE_MAX_TOKENS: ${CLAUDE_MAX_TOKENS:-1500}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: none
    volumes:
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped
